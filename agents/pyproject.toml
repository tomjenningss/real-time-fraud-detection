[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fraud-agents"
version = "0.1.0"
description = "Claude-orchestrated fraud investigation with deterministic policy enforcement"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.79,<1",
  "confluent-kafka>=2.6,<3",
  "httpx>=0.27,<1",
  "openinference-semantic-conventions>=0.1.25,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]
evaluation = ["arize-phoenix-client>=2.2,<4"]

[project.scripts]
fraud-investigate = "fraud_agents.cli:main"
fraud-router = "fraud_agents.router_service:main"
fraud-investigation-worker = "fraud_agents.worker_service:main"
fraud-outbox-publisher = "fraud_agents.outbox_service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
