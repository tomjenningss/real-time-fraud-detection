services:
  kafka:
    image: docker.io/confluentinc/cp-kafka:8.1.6
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  control-center:
    image: docker.io/confluentinc/cp-enterprise-control-center-next-gen:2.6.0
    ports:
      - "127.0.0.1:9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_REST_LISTENERS: http://0.0.0.0:9021
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MODE_ENABLE: management
      CONTROL_CENTER_PROMETHEUS_ENABLE: "false"
      CONTROL_CENTER_SCHEMA_REGISTRY_ENABLE: "false"
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    restart: unless-stopped

  jobmanager:
    image: localhost/local/flink-kafka:1.20.2
    build:
      context: .
      dockerfile: Dockerfile.flink
    command: jobmanager
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        parallelism.default: 1
    restart: unless-stopped

  taskmanager:
    image: localhost/local/flink-kafka:1.20.2
    build:
      context: .
      dockerfile: Dockerfile.flink
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1728m
    restart: unless-stopped

  sql-client:
    image: localhost/local/flink-kafka:1.20.2
    build:
      context: .
      dockerfile: Dockerfile.flink
    command: bin/sql-client.sh
    profiles:
      - tools
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ./sql:/workspace/sql:ro

volumes:
  kafka-data:
